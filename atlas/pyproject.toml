[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hornsa-atlas"
version = "0.1.13"
description = "Atlas — local MCP server for codebase ingestion, AI-powered query, impact analysis, and edge-case detection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Horn Software Architects", email = "hello@hornsoftwarearchitects.co.za" }]
keywords = ["mcp", "codebase", "ai", "claude", "developer-tools", "code-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "torch>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "mcp>=2.0",
    "transformers>=4.40,<5",
    # ingest/parsers.py imports every grammar at import time, so all are required
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.25",
    "tree-sitter-swift>=0.7",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-scala>=0.26",
    "tree-sitter-lua>=0.5",
    "tree-sitter-elixir>=0.3",
    "tree-sitter-dart>=0.1",
    "tree-sitter-zig>=1.1",
]

[project.optional-dependencies]
# Kept so `pip install hornsa-atlas[parsers]` and `[all]` keep working; the
# grammars are now regular dependencies.
parsers = []
all = []

[project.scripts]
atlas = "atlas.cli:main"
atlas-benchmark = "atlas.benchmarking:main"
atlas-prepare-benchmark = "atlas.prepare_benchmark:main"

[project.urls]
Homepage = "https://hornsoftwarearchitects.co.za/atlas"
Documentation = "https://hornsoftwarearchitects.co.za/atlas/docs"
Repository = "https://github.com/horn-software/atlas"
"Bug Tracker" = "https://github.com/horn-software/atlas/issues"

[tool.setuptools]
package-dir = { atlas = "." }
packages = [
    "atlas",
    "atlas.edge",
    "atlas.ingest",
    "atlas.query",
]
include-package-data = false

[tool.setuptools.package-data]
atlas = ["py.typed", "benchmarking/*.json"]
