[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hornsa-atlas"
version = "0.1.1"
description = "Atlas — local MCP server for codebase ingestion, AI-powered query, impact analysis, and edge-case detection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Horn Software Architects", email = "hello@hornsoftwarearchitects.co.za" }]
keywords = ["mcp", "codebase", "ai", "claude", "developer-tools", "code-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "torch>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
# Tree-sitter language parsers (installed automatically by `atlas init`)
parsers = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]
all = ["hornsa-atlas[parsers]"]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Homepage = "https://hornsa.com/atlas"
Documentation = "https://hornsa.com/atlas/docs"
Repository = "https://github.com/horn-software/atlas"
"Bug Tracker" = "https://github.com/horn-software/atlas/issues"

[tool.setuptools.packages.find]
where = [".."]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["py.typed"]
